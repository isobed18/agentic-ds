/* ------------------------------------------------------------------------- */

const NS = "http://www.w3.org/2000/svg";
const cam = document.getElementById("cam");
const el = (tag, a, txt) => {
  const n = document.createElementNS(NS, tag);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  return n;
};

const boxH = id => H + (NODES[id][6] ? NODES[id][6].length*30 + 22 : 0);
// Sağdan sola dönen oklar kutuların içinden geçmesin diye kendi yatay
// şeritlerini kullanır. Anahtar "kaynak>hedef", değer şeridin y'si.
const LANE = {"tablo>intake":1090, "inceleme>intake":1120, "agac>intake":1060};
for (const [from,to] of EDGES){
  const [px,py] = NODES[from], [qx,qy] = NODES[to];
  const ph = boxH(from), qh = boxH(to);
  let d;
  if (py === qy){
    d = `M${px+W} ${py+H/2} L${qx-13} ${qy+H/2}`;
  } else if (qx > px){
    d = `M${px+W} ${py+H/2} L${px+W+60} ${py+H/2} L${px+W+60} ${qy+H/2} L${qx-13} ${qy+H/2}`;
  } else {
    const lane = LANE[from+">"+to] ?? (py+H+70);
    d = `M${px+W/2} ${py+ph} L${px+W/2} ${lane} L${qx+W/2} ${lane} L${qx+W/2} ${qy-13}`;
  }
  cam.appendChild(el("path", {d, fill:"none", stroke:"var(--rule)", "stroke-width":2, "marker-end":"url(#a)"}));
}
for (const id in NODES){
  const [x,y,T,ad,alt,kind,inner] = NODES[id];
  cam.appendChild(el("rect", {x, y, width:W, height:boxH(id), rx:2,
    fill: kind ? "var(--fill)" : "var(--ground)",
    stroke:"var(--rule)", "stroke-width": kind===2 ? 2.5 : 2,
    "stroke-dasharray": kind===2 ? "7 4" : "none"}));
  if (T) cam.appendChild(el("text", {x:x+22, y:y+34, "font-size":17, fill:"var(--faint)"}, T));
  cam.appendChild(el("text", {x:x+22, y: T ? y+72 : y+58, "font-size":24, "font-weight":600, fill:"var(--ink)"}, ad));
  cam.appendChild(el("text", {x:x+22, y: T ? y+101 : y+88, "font-size":16, fill:"var(--muted)"}, alt));
  // İç modüller yalnızca yakınlaşınca okunacak boyutta çizilir.
  if (inner){
    cam.appendChild(el("line", {x1:x+22, y1:y+H-4, x2:x+W-22, y2:y+H-4,
      stroke:"var(--hair)", "stroke-width":1}));
    inner.forEach((satir, k) => cam.appendChild(el("text",
      {x:x+22, y:y+H+24+k*30, "font-size":15, fill:"var(--muted)"}, satir)));
  }
}

const VB = {x:40, y:-60, w:2340, h:2140};
let i = Math.max(0, Math.min(SLIDES.length-1,
  (parseInt(new URLSearchParams(location.search).get("s"), 10) || 1) - 1));
const page = document.getElementById("page"), card = document.getElementById("card");
function render(){
  const s = SLIDES[i];
  if (s.page){
    page.classList.add("on"); card.hidden = true;
    document.getElementById("p-eb").textContent = s.e;
    document.getElementById("p-ttl").textContent = s.t;
    document.getElementById("p-body").innerHTML = s.b;
    page.scrollTop = 0;
  } else {
    page.classList.remove("on"); card.hidden = false;
    if (s.n){
      const [x,y] = NODES[s.n], k = 2.3;
      cam.setAttribute("transform", `translate(${VB.x+VB.w/2-(x+W/2)*k} ${VB.y+VB.h/2-(y+H/2)*k}) scale(${k})`);
    } else {
      cam.setAttribute("transform", "translate(0 0) scale(1)");
    }
    document.getElementById("eb").textContent = s.e;
    document.getElementById("ttl").textContent = s.t;
    document.getElementById("body").innerHTML = s.b;
  }
  document.getElementById("cnt").textContent = `${i+1} / ${SLIDES.length}`;
}
const go = d => { i = Math.max(0, Math.min(SLIDES.length-1, i+d)); render(); };
document.getElementById("next").onclick = () => go(1);
document.getElementById("prev").onclick = () => go(-1);
addEventListener("keydown", e => {
  if (e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); go(1); }
  else if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(-1); }
  else if (e.key==="0"||e.key==="Home"){ i=0; render(); }
  else if (e.key.toLowerCase()==="s"){ card.hidden = !card.hidden; }
});
document.getElementById("svg").addEventListener("click", () => go(1));
render();
</script>
