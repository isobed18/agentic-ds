[project]
name = "ads"
version = "0.0.1"
description = "Agentic Data Science / ML Pipeline — local, self-hosted"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pandas>=2.2",
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
workflow-prefect = [
    "prefect>=3,<4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.hatch.build.targets.wheel.force-include]
# The built React bundle (npm --prefix web run build).
"src/ads/api/static" = "ads/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
