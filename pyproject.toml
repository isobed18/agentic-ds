[project]
name = "ads"
version = "0.0.1"
description = "Agentic Data Science / ML Pipeline — local, self-hosted"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.1,<7",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pydantic-ai-slim>=2.33.0,<3",
    "pandera[pandas]>=0.32.1,<0.33",
    "cleanlab>=2.9,<3",
]

[project.optional-dependencies]
documents-docling = [
    "docling>=2.121.0,<3",
]
documents-unstructured = [
    "unstructured[pdf]>=0.27.1,<1",
]
# Install these into isolated worker venvs with
# scripts/install_document_engines.ps1. Their dependency pins intentionally do
# not share the application environment.
documents-marker-worker = [
    "marker-pdf>=2.0.0,<3",
]
documents-mineru-worker = [
    "mineru[all]>=3.4.5,<4",
]
api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]
workflow-prefect = [
    "prefect>=3.8.3,<4",
]
# Fold-local vectorisers offered to sandboxed agent code. Optional because the
# pipeline runs without it; the sandbox helper is simply not importable.
sandbox = [
    "skrub>=0.10.0,<1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.hatch.build.targets.wheel.force-include]
# The built React bundle (npm --prefix web run build).
"src/ads/api/static" = "ads/api/static"
"src/ads/skills" = "ads/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root as well as src/: four test modules import `tests.*` or
# `alternatives.*`, which resolve only if the root is importable. `python -m
# pytest` inserts the working directory and hid this locally; a bare `pytest`,
# which is what CI runs, does not.
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
