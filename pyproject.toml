[project]
name = "ads"
version = "0.0.1"
description = "Agentic Data Science / ML Pipeline — local, self-hosted"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pandas>=2.2",
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "pypdf>=5.0,<7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-ai-slim>=2.31,<3",
    "pandera[pandas]>=0.32,<0.33",
    "cleanlab>=2.9,<3",
]

[project.optional-dependencies]
# Kesif katmani: dosya tanima ve yonlendirme (src/ads/kesif).
# Cekirdege eklenmedi; bu bilesen kullanilmadan kurulum gerekmez.
# pypdf burada YOK: cekirdek bagimliliklarda zaten var (pypdf>=5.0,<7).
# Ikinci kez, ustsuz bir sinirla listelemek surum catismasi uretirdi.
kesif = [
    "magika>=1.0",
    "mcp>=2.0",
]
# OCR: taranmis tablo ve ekran goruntusu okuma (src/ads/kesif/formatlar/goruntu).
# Ayri tutuldu cunku KURULU BOYUT ~245 MB (opencv 125 + onnxruntime 82) ve
# yalnizca goruntu/taranmis belge isleyenler ihtiyac duyar.
# headless opencv bilincli tercih: sunucuda GUI kutuphaneleri gereksiz
# (Linux'ta X11/GTK bagimliliklarini da dusurur).
# Modeller pakete GOMULU gelir; calisma aninda indirme yapmaz (air-gap dogrulandi).
#
# NOT: PDF/OCR isi src/ads/documents (docling, unstructured) ile ORTUSUYOR.
# Konsolidasyon bekliyor; bkz. docs/kesif-entegrasyon.md.
kesif-ocr = [
    "rapidocr-onnxruntime>=1.4,<2",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]
documents-docling = [
    "docling>=2.117,<3",
]
documents-unstructured = [
    "unstructured[pdf]>=0.18,<1",
]
# Install these into isolated worker venvs with
# scripts/install_document_engines.ps1. Their dependency pins intentionally do
# not share the application environment.
documents-marker-worker = [
    "marker-pdf>=1.10,<2",
]
documents-mineru-worker = [
    "mineru[all]>=3.3,<4"
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
workflow-prefect = [
    "prefect>=3,<4",
]
# Fold-local vectorisers offered to sandboxed agent code. Optional because the
# pipeline runs without it; the sandbox helper is simply not importable.
sandbox = [
    "skrub>=0.5,<1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.hatch.build.targets.wheel.force-include]
# The built React bundle (npm --prefix web run build).
"src/ads/api/static" = "ads/api/static"
"src/ads/skills" = "ads/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root as well as src/: four test modules import `tests.*` or
# `alternatives.*`, which resolve only if the root is importable. `python -m
# pytest` inserts the working directory and hid this locally; a bare `pytest`,
# which is what CI runs, does not.
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
