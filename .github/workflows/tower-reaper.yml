# gh-tower: reaper — expires leases, reclaims tasks from silent actors.
# Install at .github/workflows/tower-reaper.yml
name: tower-reaper
on:
  schedule:
    # Hourly, not the template's */15. The lease TTL is 240 minutes, so a
    # quarter-hourly sweep checks 16 times per window it can act on. For a
    # four-person team that is ~2,900 runs a month to reclaim a handful of
    # leases. Raise it again if leases start expiring faster than they are
    # noticed.
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: tower           # same lane as the coordinator — single writer preserved
  cancel-in-progress: false

jobs:
  reap:
    if: vars.TOWER_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: isobed18/gh-tower/actions/coordinator@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: reap
          # agent-stale-minutes: "120"
          # human-stale-minutes: "1440"
