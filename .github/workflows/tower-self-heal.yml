# gh-tower: self-heal — diagnostic envelopes + agent fix routing on red CI.
# Install at .github/workflows/tower-self-heal.yml
name: tower-self-heal
on:
  workflow_run:
    # Must match the `name:` in ci.yml exactly, and ours is lowercase. The
    # template ships "CI", which matches no workflow here -- self-heal simply
    # never fired, silently, which is the worst way for a safety net to fail.
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  heal:
    if: vars.TOWER_ENABLED != 'false' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: isobed18/gh-tower/actions/self-heal@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # fix-mention: "@codex"        # or "@claude", whoever fixes agent PRs
          # agent-branch-prefixes: "codex/,claude/,agent/,copilot/"
          # max-heal-attempts: "3"
